<!doctype html>
<html>
<head>
<title>Student Registration</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="container">
<h1>Student Registration Form</h1>
<form action="/register" method="POST">
<label>Student Name</label>
<input type="text" name="name" required />
<label>Register Number</label>
<input type="text" name="regno" required />
<label>Email</label>
<input type="email" name="email" required />
<label>Mobile Number</label>
<input type="text" name="mobile" pattern="[0-9]{10}" maxlength="10" required />
<label>Gender</label>
<div class="radio">
<input type="radio" name="gender" value="Male" required /> Male
<input type="radio" name="gender" value="Female" /> Female
<input type="radio" name="gender" value="Other" /> Other
</div>
<label>Date of Birth</label>
<input type="date" name="dob" required />
<label>Department</label>
<select name="department" required>
<option value="">Select Department</option>
<option value="Computer Applications">Computer Applications</option>
<option value="Computer Science">Computer Science</option>
<option value="Information Technology">Information Technology</option>
<option value="Electronics">Electronics</option>
</select>
<label>Course</label>
<select name="course" required>
<option value="">Select Course</option>
<option value="MCA">MCA</option>
<option value="M.Sc Computer Science">M.Sc Computer Science</option>
<option value="BCA">BCA</option>
<option value="B.Sc Computer Science">B.Sc Computer Science</option>
</select>
<label>Year</label>
<select name="year" required>
<option value="">Select Year</option>
<option value="1st Year">1st Year</option>
<option value="2nd Year">2nd Year</option>
<option value="3rd Year">3rd Year</option>
</select>
<label>Address</label>
<textarea name="address" rows="4" required></textarea>
<label>Skills</label>
<div class="skills">
<label><input type="checkbox" name="skills" value="Python" /> Python</label>
<label><input type="checkbox" name="skills" value="Java" /> Java</label>
<label><input type="checkbox" name="skills" value="JavaScript" /> JavaScript</label>
<label><input type="checkbox" name="skills" value="HTML/CSS" /> HTML/CSS</label>
<label><input type="checkbox" name="skills" value="Node.js" /> Node.js</label>
</div>
<button type="submit">Register Student</button>
</form>
<a class="logout" href="/logout">Logout</a>
</div>
</body>
</html>
